# XGBoost model configuration
base_config: "base.yaml"
data_config: "data.yaml"

model:
  name: "xgboost"
  type: "tree_based"
  
  # Model parameters
  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0
    reg_alpha: 0
    reg_lambda: 1
    scale_pos_weight: 1
    tree_method: "auto"
    booster: "gbtree"
    
  # Hyperparameter tuning
  hyperparameters:
    n_estimators: [50, 100, 200, 300]
    max_depth: [3, 4, 5, 6, 7, 8]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.6, 0.8, 1.0]
    min_child_weight: [1, 3, 5]
    gamma: [0, 0.1, 0.2]
    
  # Feature importance settings
  feature_importance:
    methods:
      - "weight"
      - "gain"
      - "cover"
      - "total_gain"
      - "total_cover"
    top_n_features: 10
    plot_importance: true
    
  # Model evaluation
  evaluation:
    metrics:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1"
      - "roc_auc"
    early_stopping_rounds: 50
    eval_metric: "logloss"
    cross_validation: true
    n_splits: 5 