# Inherit base configuration
base_config: "base.yaml"

# Model-specific configuration
model:
  name: "RandomForest"
  type: "RandomForestClassifier"
  params:
    n_estimators: 150
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 3
    random_state: 42
    class_weight: "balanced"
    n_jobs: -1

# Training settings
training:
  tasks: ["ripeness"]  # Specify which tasks to train on
  models: ["RandomForest"]  # Only train RandomForest
  early_stopping_patience: 10
  validation_split: 0.2
  random_seed: 42

# Data settings
data:
  test_size: 0.2
  validation_size: 0.1
  stratify: true
  shuffle: true

# Logging settings
logging:
  wandb_project: "multitask-classifier"
  log_metrics: true
  log_feature_importance: true
  log_model_architecture: true 