# CatBoost model configuration
model:
  name: "catboost"
  type: "tree_based"
  
  # Model parameters
  params:
    iterations: 100
    depth: 6
    learning_rate: 0.1
    l2_leaf_reg: 3
    bootstrap_type: "Bernoulli"
    subsample: 0.8
    random_strength: 1
    bagging_temperature: 1
    od_type: "Iter"
    od_wait: 10
    leaf_estimation_method: "Newton"
    grow_policy: "SymmetricTree"
    
  # Hyperparameter tuning
  hyperparameters:
    iterations: [50, 100, 200, 300]
    depth: [3, 4, 5, 6, 7, 8]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    l2_leaf_reg: [1, 3, 5, 7]
    subsample: [0.6, 0.8, 1.0]
    random_strength: [0.1, 1, 10]
    
  # Feature importance settings
  feature_importance:
    methods:
      - "PredictionValuesChange"
      - "LossFunctionChange"
      - "ShapValues"
    top_n_features: 10
    plot_importance: true
    interaction_strength: true
    
  # Model evaluation
  evaluation:
    metrics:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1"
      - "roc_auc"
    early_stopping_rounds: 50
    eval_metric: "Logloss"
    cross_validation: true
    n_splits: 5 